services:
  init-perms:
    image: busybox:1.36
    command: sh -c "mkdir -p /data && chown -R 10001:10001 /data"
    volumes:
      - ./data:/data

  hf-s3-gateway:
    image: ghcr.io/grothkeiran/hf-s3-gateway:latest
    depends_on:
      init-perms:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
    environment:
      APP_ADDR: ":9000"
      STORAGE_BACKEND: "local"
      S3_ACCESS_KEY: "openlist"
      S3_SECRET_KEY: "change-me"
      HF_NAMESPACE: "your-hf-namespace"
      HF_BUCKET: "your-bucket"
      HF_TOKEN: "hf_xxx"
      DATA_DIR: "/data"
      HF_WORK_DIR: "/data/.hf-tmp"
      PUBLIC_BASE_URL: "http://your-host:9000"
      GATEWAY_SIGN_SECRET: "change-this-gateway-link-secret"
      PUBLIC_READ: "false"
      CORS_ALLOW_ORIGINS: "*"
      OBJECT_CONTENT_DISPOSITION: "inline"
      OBJECT_CACHE_CONTROL: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/data
